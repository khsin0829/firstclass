<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버거킹 로그인 화면</title>
    <link rel="stylesheet" href="../font/css/BKBulMatPro.css">
    <link rel="stylesheet" href="../font/css/SDGothicNeoRound.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" id="theme-style" href="css/login-y2k-chrome.css">
    <link rel="stylesheet" href="css/login-theme-gallery.css">

    
</head>
<body>
    <div id="wrap" class="y2k-chrome">
        <header>
            <h1>로그인</h1>
            <button class="prev_btn"><span class="sr-only">이전버튼</span></button>

        </header>
        <section class="theme-gallery" aria-labelledby="theme-gallery-title">
            <div class="theme-gallery-heading">
                <h2 id="theme-gallery-title">DESIGN THEMES</h2>
                <p>원하는 디자인을 선택해 보세요.</p>
            </div>
            <div class="theme-gallery-list">
                <button type="button" class="theme-card" data-theme="cyber-login" aria-pressed="false">
                    <span class="theme-preview preview-cyber"><i></i><i></i><i></i></span>
                    <span class="theme-card-name">Cyberpunk</span>
                    <span class="theme-card-desc">NEON · FUTURE</span>
                </button>
                <button type="button" class="theme-card is-active" data-theme="y2k-chrome" aria-pressed="true">
                    <span class="theme-preview preview-chrome"><i></i><i></i><i></i></span>
                    <span class="theme-card-name">Y2K Chrome</span>
                    <span class="theme-card-desc">SILVER · GLOSSY</span>
                </button>
                <button type="button" class="theme-card" data-theme="neo-login" aria-pressed="false">
                    <span class="theme-preview preview-neo"><i></i><i></i><i></i></span>
                    <span class="theme-card-name">Neo Brutalism</span>
                    <span class="theme-card-desc">BOLD · COLOR</span>
                </button>
                <button type="button" class="theme-card" data-theme="glass-login" aria-pressed="false">
                    <span class="theme-preview preview-glass"><i></i><i></i><i></i></span>
                    <span class="theme-card-name">Glassmorphism</span>
                    <span class="theme-card-desc">FROSTED · SOFT</span>
                </button>
            </div>
        </section>
        <main>
            <h2 class="title">
                <span>안녕하세요:)</span>
                <span>버거킹입니다.</span>
            </h2>
            <form action="">
                <!-- 이메일 로그인 -->
                <fieldset>
                    <legend class="sr-only">로그인화면</legend>
                    <!-- 아이디 -->
                    <label for="email">이메일 로그인</label>
                    <div class="input_box">
                        <input type="email" id="email" name="email" placeholder="아이디(이메일)을 입력해 주세요.">
                    </div>
                    <!-- 비밀번호 -->
                    <div class="input_box rela">
                        <input type="password" name="password" placeholder="비밀번호를 입력해 주세요.">
                        <button type="button" class="pw_btn"><span class="sr-only">비밀번호 보기</span></button>
                    </div>
                    <div class="login_option">
                        <label>
                            <input class="check sr-only" type="checkbox" checked>
                            <span>자동 로그인</span>
                        </label>
                        <label>
                            <input class="check sr-only" type="checkbox">
                            <span>아이디 저장</span>
                        </label>
                    </div>
                    <button type="submit" class="login_btn">로그인</button>
                </fieldset>
            </form>
            <div class="login_link">
                <a href="#">아이디 찾기</a>
                <a href="#">비밀번호 재설정</a>
                <a href="#">회원가입</a>
            </div>
            <div class="sns_login">
                <p>SNS로 간편하게 로그인</p>
                <div class="sns_list">
                    <a href="#"><span class="sr-only">카카오로그인</span></a>
                    <a href="#"><span class="sr-only">네이버로그인</span></a>
                    <a href="#"><span class="sr-only">애플로그인</span></a>
                    <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                </div>
            </div>
        </main>
    </div>
    <script>
        // 테마 이름에 따라 적용할 CSS 파일을 연결합니다.
        const themeStyle = document.querySelector("#theme-style");
        const loginWrap = document.querySelector("#wrap");
        const themeCards = document.querySelectorAll(".theme-card");

        const themes = {
            "cyber-login": "login-cyberpunk.css",
            "y2k-chrome": "login-y2k-chrome.css",
            "neo-login": "login-neo.css",
            "glass-login": "login-glassmorphism.css"
        };

        function changeTheme(themeName) {
            if (!themes[themeName]) return;

            loginWrap.classList.remove(...Object.keys(themes));
            loginWrap.classList.add(themeName);
            themeStyle.href = "css/" + themes[themeName];

            themeCards.forEach(function (card) {
                const isSelected = card.dataset.theme === themeName;
                card.classList.toggle("is-active", isSelected);
                card.setAttribute("aria-pressed", isSelected);
            });

            localStorage.setItem("burgerking-login-theme", themeName);
        }

        const savedTheme = localStorage.getItem("burgerking-login-theme");
        changeTheme(savedTheme && themes[savedTheme] ? savedTheme : "y2k-chrome");

        themeCards.forEach(function (card) {
            card.addEventListener("click", function () {
                changeTheme(this.dataset.theme);
            });
        });
    </script>ipt>
</body>
</html>
