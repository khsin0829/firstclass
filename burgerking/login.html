<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버거킹 로그인 화면</title>
    <link rel="stylesheet" href="../font/css/BKBulMatPro.css">
    <link rel="stylesheet" href="../font/css/SDGothicNeoRound.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" id="theme-style" href="css/login-y2k-chrome.css">

    
</head>
<body>
    <div id="wrap" class="y2k-chrome">
        <header>
            <h1>로그인</h1>
            <button class="prev_btn"><span class="sr-only">이전버튼</span></button>
            <label class="theme-switcher">
                <span class="sr-only">디자인 테마 선택</span>
                <select id="theme-select" aria-label="디자인 테마 선택">
                    <option value="cyber-login" data-css="login-cyberpunk.css">Cyberpunk</option>
                    <option value="y2k-chrome" data-css="login-y2k-chrome.css" selected>Y2K Chrome</option>
                    <option value="neo-login" data-css="login-neo.css">Neo Brutalism</option>
                </select>
            </label>
        </header>
        <main>
            <h2 class="title">
                <span>안녕하세요:)</span>
                <span>버거킹입니다.</span>
            </h2>
            <form action="">
                <!-- 이메일 로그인 -->
                <fieldset>
                    <legend class="sr-only">로그인화면</legend>
                    <!-- 아이디 -->
                    <label for="email">이메일 로그인</label>
                    <div class="input_box">
                        <input type="email" id="email" name="email" placeholder="아이디(이메일)을 입력해 주세요.">
                    </div>
                    <!-- 비밀번호 -->
                    <div class="input_box rela">
                        <input type="password" name="password" placeholder="비밀번호를 입력해 주세요.">
                        <button type="button" class="pw_btn"><span class="sr-only">비밀번호 보기</span></button>
                    </div>
                    <div class="login_option">
                        <label>
                            <input class="check sr-only" type="checkbox" checked>
                            <span>자동 로그인</span>
                        </label>
                        <label>
                            <input class="check sr-only" type="checkbox">
                            <span>아이디 저장</span>
                        </label>
                    </div>
                    <button type="submit" class="login_btn">로그인</button>
                </fieldset>
            </form>
            <div class="login_link">
                <a href="#">아이디 찾기</a>
                <a href="#">비밀번호 재설정</a>
                <a href="#">회원가입</a>
            </div>
            <div class="sns_login">
                <p>SNS로 간편하게 로그인</p>
                <div class="sns_list">
                    <a href="#"><span class="sr-only">카카오로그인</span></a>
                    <a href="#"><span class="sr-only">네이버로그인</span></a>
                    <a href="#"><span class="sr-only">애플로그인</span></a>
                    <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                </div>
            </div>
        </main>
    </div>
    <script>
        // 선택한 테마에 맞춰 CSS 파일과 페이지 클래스를 함께 변경합니다.
        const themeSelect = document.querySelector("#theme-select");
        const themeStyle = document.querySelector("#theme-style");
        const loginWrap = document.querySelector("#wrap");
        const themeOptions = ["cyber-login", "y2k-chrome", "neo-login"];

        function changeTheme(themeName) {
            const selectedOption = themeSelect.selectedOptions[0];
            loginWrap.classList.remove(...themeOptions);
            loginWrap.classList.add(themeName);
            themeStyle.href = "css/" + selectedOption.dataset.css;
            localStorage.setItem("burgerking-login-theme", themeName);
        }

        const savedTheme = localStorage.getItem("burgerking-login-theme");
        if (savedTheme && themeOptions.includes(savedTheme)) {
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);
        }

        themeSelect.addEventListener("change", function () {
            changeTheme(this.value);
        });
    </script>
</body>
</html>
